      - name: Match upstream Windows LLVM requirement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco upgrade llvm --version 22.1.8 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'LLVM setup failed' }
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) { throw 'libclang missing' }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          rustc --version --verbose
          cargo --version
      - name: Test offline policy (CPU only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --locked -p koharu-runtime --lib lab_
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed' }
      - name: Test pixel guard (CPU only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --locked -p koharu-batch --bin koharu-batch lab202_
          if ($LASTEXITCODE -ne 0) { throw 'Pixel guard tests failed' }
          cargo test --release --locked -p koharu-batch --bin koharu-batch lab208_
          if ($LASTEXITCODE -ne 0) { throw 'Hybrid guard tests failed' }
      - name: Compile headless diagnostic binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p koharu-batch --bin koharu-batch
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Verify CLI guard and record artifact identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/release/koharu-batch.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing EXE' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed' }
          # No input data and no GPU use: this invocation must refuse before store initialization.
          $PSNativeCommandUseErrorActionPreference = $false
          $guard = & $exe run --output 'unused-lab-output' --stages translate 2>&1
          if ($LASTEXITCODE -eq 0 -or ($guard -join ' ') -notmatch 'LAB208: usage lab-hybrid') { throw 'Stage guard failed' }
          $guard = & $exe lab-hybrid 2>&1
          if ($LASTEXITCODE -eq 0 -or ($guard -join ' ') -notmatch 'LAB208: usage lab-hybrid') { throw 'Hybrid argument guard failed' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "KOHARU_LAB_208_SHA256=$hash"
          "$hash  koharu-batch.exe" | Set-Content 'target/release/koharu-lab-208-sha256.txt' -Encoding ascii
          @("source=35505f9969f6703b0d90db36a384ed062fc3bdcb", "workflow_run=$env:GITHUB_RUN_ID", (rustc --version), (cargo --version)) | Set-Content 'target/release/koharu-lab-208-build.txt' -Encoding utf8
      - name: Upload diagnostic executable and provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koharu-batch-0.93.0-hybrid-integration-lab-208
          path: |
            target/release/koharu-batch.exe
            target/release/koharu-lab-208-sha256.txt
            target/release/koharu-lab-208-build.txt
          if-no-files-found: error
          retention-days: 7
