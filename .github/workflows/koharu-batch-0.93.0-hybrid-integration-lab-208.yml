ut lock=session.lock();\n        lock.apply(Edit{label:"Hybrid guarded background".to_owned(),ops:vec![Op::AddFile{bytes},Op::SetBackground{page:page.id.into(),background:Some(koharu_scene::Background{file:hash,visible:true})}]})?;\n        let rendered=Renderer::get().render(&lock,page.id)?.rasterize()?.image;\n        ensure!(rendered.dimensions()==page.original.dimensions(),"LAB208: renderer size mismatch");\n        let opaque=rendered.pixels().all(|p|p.0[3]==255);\n        let rendered=image::DynamicImage::ImageRgba8(rendered).into_rgb8();\n        let changed=page.original.enumerate_pixels().filter(|(x,y,p)|protect.get_pixel(*x,*y).0[0]!=0 && rendered.get_pixel(*x,*y)!=*p).count();\n        let mut text_zone=image::GrayImage::new(page.original.width(),page.original.height());\n        let placed=lock.project();\n        for b in &page.blocks { if !b.held {\n            let koharu_scene::Content::Block(block)=&placed.layer(b.id)?.content else {bail!("LAB208: missing placed block")};\n            let bounds=block.translation.as_ref().and_then(|t|t.bounds()).context("LAB208: missing translation bounds")?;\n            let rect=koharu_scene::Rect::covering(bounds,rendered.width(),rendered.height()).context("LAB208: translation outside page")?;\n            hybrid_frame208(&mut text_zone,rect);\n        } }\n        // A two-pixel allowance for antialiasing/outline; protection remains exact.\n        let text_zone=hybrid_dilate208(&text_zone,2);\n        let outside=clean.enumerate_pixels().filter(|(x,y,p)|text_zone.get_pixel(*x,*y).0[0]==0 && rendered.get_pixel(*x,*y)!=*p).count();\n        let accepted=opaque && changed==0 && outside==0;\n        let final_image=if accepted {&rendered} else {&page.original};\n        protect.save(output.join(format!("{prefix}-protect.png")))?;\n        effective.save(output.join(format!("{prefix}-effective.png")))?;\n        page.original.save(output.join(format!("{prefix}-original.png")))?;\n        clean.save(output.join(format!("{prefix}-clean.png")))?;\n        final_image.save(output.join(format!("{prefix}-diagnostic.png")))?;\n        ensure!(image::open(output.join(format!("{prefix}-diagnostic.png")))?.into_rgb8()==*final_image,"LAB208: PNG mismatch");\n        let current=lock.project();\n        let block_reports:Vec<_>=page.blocks.iter().map(|b| {\n            let translated=current.layer(b.id).ok().and_then(|l|match &l.content {koharu_scene::Content::Block(v)=>v.translation.as_ref().map(|t|t.content.text()),_=>None});\n            json!({"id":b.id,"held":b.held,"reason":b.reason,"translation":translated})\n        }).collect();\n        reports.push(json!({"page":prefix,"id":page.id,"protected_changed_candidate":changed,"outside_translation_zone_candidate":outside,"opaque":opaque,"status":if accepted {"diagnostic_render"} else {"original_fallback"},"blocks":block_reports}));\n    }\n    fs_err::write(output.join("hybrid-report.json"),serde_json::to_vec_pretty(&json!({"schema":"koharu-hybrid-native-result-v1","status":"diagnostic_only_not_for_publication","pages":reports}))?)?;\n    koharu_runtime::lab_verify_file(&source,size,sha).await?;\n    Ok(())\n}\n\n#[cfg(test)]\nmod hybrid208_tests {\n    use super::*;\n    #[test]\n    fn lab208_dilation() {\n        let mask=image::GrayImage::from_raw(5,1,vec![0,0,255,0,0]).unwrap();\n        assert_eq!(hybrid_dilate208(&mask,1).as_raw(),&[0,255,255,255,0]);\n        assert_eq!(hybrid_dilate208(&mask,3).as_raw(),&[255;5]);\n    }\n    #[test]\n    fn lab208_conflict_is_atomic() {\n        let make=|region,erase,held|HybridBlock208{id:koharu_scene::LayerId(koharu_scene::Uuid::now_v7()),region:image::GrayImage::from_raw(3,1,region).unwrap(),erase:image::GrayImage::from_raw(3,1,erase).unwrap(),held,reason:String::new()};\n        let mut p=HybridPage208{id:PageId(koharu_scene::Uuid::now_v7()),original:image::RgbImage::new(3,1),blocks:vec![make(vec![255,0,0],vec![0,0,0],true),make(vec![255,255,0],vec![255,255,0],false),make(vec![0,255,255],vec![0,255,255],false)]};\n        assert_eq!(hybrid_conflict208(&mut p).as_raw(),&[255;3]);\n        assert!(p.blocks.iter().all(|b|b.held));\n    }\n}\n',True),
