              ('crates/koharu-batch/src/main.rs', 'b0c1a7e03a584e2454a8be44a7ad0e991c23369e7e100de8a311198b7c3534f2', '5e8eee1887608ccb32de54108753dc1f532eecb5cfbb9e4423df69806e5b14e7', '//! `koharu-batch`: one chapter, end to end, from a terminal.\n\nmod cli;\nmod preset;\nmod prune;\nmod report;\nmod run;\n\nuse anyhow::Result;\n\n\n#[tokio::main]\nasync fn main() -> Result<()> {\n    tracing_subscriber::fmt()\n        .with_env_filter(\n            tracing_subscriber::EnvFilter::try_from_default_env().unwrap_or_else(|_| {\n                tracing_subscriber::EnvFilter::new("warn,koharu_batch=info,koharu_pipeline=info")\n            }),\n        )\n        .with_writer(std::io::stderr)\n        .init();\n    let args: Vec<_> = std::env::args_os().skip(1).collect();\n    if args.len() == 1 && args[0] == std::ffi::OsStr::new("--help") {\n        println!("LAB202: lab-lama-replay INPUT_MANIFEST OUTPUT_DIR");\n        return Ok(());\n    }\n    anyhow::ensure!(args.len() == 3 && args[0] == std::ffi::OsStr::new("lab-lama-replay"), "LAB202: usage lab-lama-replay INPUT_MANIFEST OUTPUT_DIR");\n    run::run_lama_replay(std::path::Path::new(&args[1]), std::path::Path::new(&args[2])).await\n}\n'),
              ('crates/koharu-batch/src/run.rs', '59c589965c2284c91aa31e3fbd656b1568614a4f2eaa1061c879c058a32003df', 'f85b8394b1ae0fd195fd38bd30ccc2740a2f3fc5e5b582ade55c6800c9d13399', '\n/// LAB202: isolated LaMa replay; no project edits, OCR, detection or translation.\n/// Masks are binary full-page PNGs. No change is allowed outside the effective mask.\nfn lab202_effective(request: &image::GrayImage, protect: &image::GrayImage) -> Result<image::GrayImage> {\n    ensure!(request.dimensions() == protect.dimensions(), "LAB202: mask size mismatch");\n    ensure!(request.as_raw().iter().chain(protect.as_raw()).all(|&v| v == 0 || v == 255), "LAB202: masks must be binary");\n    Ok(image::GrayImage::from_fn(request.width(), request.height(), |x, y| {\n        image::Luma([if request.get_pixel(x,y).0[0] != 0 && protect.get_pixel(x,y).0[0] == 0 {255} else {0}])\n    }))\n}\n\nfn lab202_compose(original: &image::RgbImage, drawn: &image::RgbImage, mask: &image::GrayImage) -> Result<image::RgbImage> {\n    ensure!(original.dimensions() == drawn.dimensions() && original.dimensions() == mask.dimensions(), "LAB202: compose size mismatch");\n    Ok(image::RgbImage::from_fn(original.width(), original.height(), |x,y| {\n        if mask.get_pixel(x,y).0[0] == 255 { *drawn.get_pixel(x,y) } else { *original.get_pixel(x,y) }\n    }))\n}\n\nasync fn lab202_read(folder: &Path, row: &serde_json::Value, expected_name: &str) -> Result<image::DynamicImage> {\n    ensure!(row["name"].as_str() == Some(expected_name), "LAB202: unexpected image name");\n    let path = folder.join(expected_name);\n    ensure!(lab_metadata(&path)?.is_file(), "LAB202: invalid input file");\n    let size = row["size_bytes"].as_u64().context("LAB202: missing file size")?;\n    let sha = row["sha256"].as_str().context("LAB202: missing file hash")?;\n    ensure!(size > 0 && size <= 20_000_000 && sha.len() == 64 && sha.bytes().all(|c| c.is_ascii_hexdigit()), "LAB202: invalid input identity");\n    koharu_runtime::lab_verify_file(&path, size, sha).await?;\n    // Inspect dimensions before allocating decoded pixels; only PNG accepted.\n    let reader = image::ImageReader::open(&path)?.with_guessed_format()?;\n    ensure!(reader.format() == Some(image::ImageFormat::Png), "LAB202: expected PNG");\n    let (w,h) = reader.into_dimensions()?;\n    ensure!(w > 0 && h > 0 && w <= 4096 && h <= 4096 && u64::from(w)*u64::from(h) <= 4_000_000, "LAB202: image too large");\n    let img = image::open(&path)?;\n    ensure!(img.width() == w && img.height() == h, "LAB202: decoded size mismatch");\n    Ok(img)\n}\n\npub async fn run_lama_replay(manifest_path: &Path, output: &Path) -> Result<()> {\n    verify_lab(output).await?;\n    let exe = std::env::current_exe()?;\n    let lab = exe.parent().and_then(Path::parent).context("LAB202: invalid executable layout")?;\n    let inputs = lab.join("inputs");\n    ensure!(lab_metadata(&inputs)?.is_dir(), "LAB202: missing inputs");\n    let folder = manifest_path.parent().context("LAB202: missing input folder")?;\n    ensure!(manifest_path.is_absolute() && folder.parent().context("LAB202: invalid folder")?.canonicalize()? == inputs.canonicalize()?, "LAB202: input must be a direct child of inputs");\n    ensure!(lab_metadata(folder)?.is_dir() && lab_metadata(manifest_path)?.is_file(), "LAB202: invalid manifest path");\n    ensure!(manifest_path.file_name().and_then(|n| n.to_str()) == Some("lama-manifest.json"), "LAB202: wrong manifest filename");\n    let bytes = fs_err::read(manifest_path)?;\n    ensure!(bytes.len() <= 100_000, "LAB202: oversized manifest");\n    let manifest: serde_json::Value = serde_json::from_slice(&bytes)?;\n    ensure!(manifest["schema"] == "koharu-lama-replay-v1", "LAB202: wrong manifest schema");\n    let rows = manifest["pages"].as_array().context("LAB202: missing pages")?;\n    ensure!(!rows.is_empty() && rows.len() <= 8, "LAB202: require 1 to 8 pages");\n    let mut work = Vec::new();\n    for (i,row) in rows.iter().enumerate() {\n        let prefix = format!("page-{:02}", i+1);\n        let original = lab202_read(folder, &row["image"], &format!("{prefix}-original.png")).await?;\n        let request = lab202_read(folder, &row["request"], &format!("{prefix}-request.png")).await?;\n        let protect = lab202_read(folder, &row["protect"], &format!("{prefix}-protect.png")).await?;\n        ensure!(original.color() == image::ColorType::Rgb8 && request.color() == image::ColorType::L8 && protect.color() == image::ColorType::L8, "LAB202: require RGB8 scan and L8 masks");\n        let (original, request, protect) = (original.into_rgb8(), request.into_luma8(), protect.into_luma8());\n        ensure!(original.dimensions() == request.dimensions(), "LAB202: scan/mask mismatch");\n        let effective = lab202_effective(&request, &protect)?;\n        work.push((prefix,original,request,protect,effective));\n    }\n    fs_err::create_dir(output)?;\n    let started = std::time::Instant::now();\n    let device = koharu_runtime::device().await?;\n    ensure!(matches!(device.backend, koharu_runtime::Backend::Cuda { .. }), "LAB202: CUDA required");\n    let model = koharu_ml::lama::Lama::load(device).await?;\n    let load_seconds = started.elapsed().as_secs_f64();\n    let mut results = Vec::new();\n    for (prefix,original,request,protect,effective) in work {\n        let timer = std::time::Instant::now();\n        let requested = request.as_raw().iter().filter(|&&v| v != 0).count();\n        let allowed = effective.as_raw().iter().filter(|&&v| v != 0).count();\n        let protected = protect.as_raw().iter().filter(|&&v| v != 0).count();\n        let drawn = if allowed == 0 {original.clone()} else {model.inference(&image::DynamicImage::ImageRgb8(original.clone()), &effective)?};\n        ensure!(drawn.dimensions() == original.dimensions(), "LAB202: model output size mismatch");\n        let final_image = lab202_compose(&original,&drawn,&effective)?;\n        let mut raw_outside = 0usize;\n        let mut changed = 0usize;\n        for (x,y,pixel) in original.enumerate_pixels() {\n            if effective.get_pixel(x,y).0[0] == 0 && drawn.get_pixel(x,y) != pixel {raw_outside += 1;}\n            if final_image.get_pixel(x,y) != pixel {\n                ensure!(effective.get_pixel(x,y).0[0] == 255 && protect.get_pixel(x,y).0[0] == 0, "LAB202: forbidden pixel change");\n                changed += 1;\n            }\n        }\n        effective.save(output.join(format!("{prefix}-effective.png")))?;\n        drawn.save(output.join(format!("{prefix}-raw.png")))?;\n        let final_path = output.join(format!("{prefix}-clean.png"));\n        final_image.save(&final_path)?;\n        ensure!(image::open(&final_path)?.into_rgb8() == final_image, "LAB202: saved PNG mismatch");\n        results.push(json!({"page":prefix,"width":original.width(),"height":original.height(),"requested_pixels":requested,"protected_pixels":protected,"allowed_pixels":allowed,"blocked_overlap_pixels":requested-allowed,"raw_changed_outside_effective":raw_outside,"changed_pixels":changed,"final_changed_outside_effective":0,"final_changed_protected":0,"seconds":timer.elapsed().as_secs_f64(),"status":"diagnostic_only_not_for_publication"}));\n    }\n    fs_err::write(output.join("lama-replay.json"),serde_json::to_vec_pretty(&json!({"schema":"koharu-lama-replay-result-v1","source_commit":"35505f9969f6703b0d90db36a384ed062fc3bdcb","model_revision":"f91c85b26913b3e83f9877867b4c336da3675238","device":&device.description,"load_seconds":load_seconds,"elapsed_seconds":started.elapsed().as_secs_f64(),"results":results}))?)?;\n    Ok(())\n}\n\n#[cfg(test)]\nmod lab202_tests {\n    use super::*;\n    use image::{GrayImage, RgbImage, Rgb};\n    #[test]\n    fn lab202_overlap_and_composition() {\n        let request = GrayImage::from_raw(3,1,vec![255,255,0]).unwrap();\n        let protect = GrayImage::from_raw(3,1,vec![0,255,0]).unwrap();\n        let effective = lab202_effective(&request,&protect).unwrap();\n        assert_eq!(effective.as_raw(),&[255,0,0]);\n        let original = RgbImage::from_pixel(3,1,Rgb([10,20,30]));\n        let drawn = RgbImage::from_pixel(3,1,Rgb([200,200,200]));\n        let result = lab202_compose(&original,&drawn,&effective).unwrap();\n        assert_eq!(result.get_pixel(0,0),drawn.get_pixel(0,0));\n        assert_eq!(result.get_pixel(1,0),original.get_pixel(1,0));\n        assert_eq!(result.get_pixel(2,0),original.get_pixel(2,0));\n        assert!(lab202_effective(&request,&GrayImage::new(1,1)).is_err());\n        assert!(lab202_effective(&request,&GrayImage::from_raw(3,1,vec![1,0,0]).unwrap()).is_err());\n    }\n}\n'),
