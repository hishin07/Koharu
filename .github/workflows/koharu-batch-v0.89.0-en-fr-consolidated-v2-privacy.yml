          PRIVACY_EXPECTED = {'crates/koharu-runtime/src/store.rs': '741396BB4C85D6E3F4F5E5CAD40147778EB45F528EA713065D4B63433DDC969B', 'crates/koharu-runtime/src/network.rs': '58B6ADABC6F4E9A68BBD8BAEBFB7E5B8991F1ECCD34674EE5FCEC047F53F98F4', 'crates/koharu-runtime/src/source/hugging_face.rs': 'E555B045D112126EE8BD54C18C060BEA27B705A8FCE7E6A8626F385F2A59DE97', 'crates/koharu-runtime/src/runtime/packages/cuda.rs': 'D04015112E9AF34D7AAB359B79C6EC21A7CED540F431C06D52663D7E73EEA563', 'crates/koharu-runtime/src/runtime/packages/torch.rs': '2080392B0FE6F9184D97FBD702CB4DFF341B3DED174C9ECF544311D60B699CB7', 'crates/koharu-runtime/src/runtime/packages/llama.rs': 'EC977DC2108FC82874894485CBA5BECCD79AD9A10E09DCE54E3E414C4CBEBE9F', 'crates/koharu-runtime/src/runtime/packages/diffusion.rs': '66CCF73511C60BE8CCD49C73061C25810A52BF8733F3967FB6FA7BB93B3EF635', 'crates/koharu-translator/src/lib.rs': 'ABF3596260E3B30FFCF77353E9195279D537BA7DC1BBD1E2F8E17D952E9BC53C', 'crates/koharu-pipeline/src/batch/run.rs': '9725667F4D8ECD6FA987773B860142A0CBDC3661CA0E54600115371225BB6822'}
