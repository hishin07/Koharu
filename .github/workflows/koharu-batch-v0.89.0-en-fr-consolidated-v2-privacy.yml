          Write-Host "KOHARU_EN_FR_PRIVACY_SHA256=$hash"
          "$hash  koharu-batch.exe" | Set-Content -Path 'target/release/koharu-batch-en-fr-consolidated-v2-privacy-sha256.txt' -Encoding ascii

