              '    // Diagnostic only: expand the image passed to OCR, never region geometry or masks.\n    let (pad_x, pad_top, pad_bottom) = match std::env::var("KOHARU_DIAG_OCR_PADDING") {\n        Err(std::env::VarError::NotPresent) => (0.0, 0.0, 0.0),\n        Ok(value) => {\n            anyhow::ensure!(std::env::var_os("KOHARU_DIAG_DIR").is_some(), "OCR padding requires diagnostic directory");\n            match value.as_str() {\n                "none" => (0.0, 0.0, 0.0),\n                "top24" => (0.0, 24.0, 0.0),\n                "all24" => (24.0, 24.0, 24.0),\n                _ => bail!("invalid KOHARU_DIAG_OCR_PADDING: {value}"),\n            }\n        }\n        Err(error) => return Err(error.into()),\n    };\n    let x = (min_x - pad_x).floor().max(0.0) as u32;\n    let y = (min_y - pad_top).floor().max(0.0) as u32;\n    let right = (max_x + pad_x).ceil().max(0.0).min(f64::from(source.width())) as u32;\n    let bottom = (max_y + pad_bottom).ceil().max(0.0).min(f64::from(source.height())) as u32;',
              'experimental OCR crop padding')
          ocr_path.write_text(o, encoding='utf-8', newline='\n')
          # The pipeline already supports Hayai; expose that existing implementation to batch.
          c = cli_path.read_text(encoding='utf-8')
          c = replace_once(c,
