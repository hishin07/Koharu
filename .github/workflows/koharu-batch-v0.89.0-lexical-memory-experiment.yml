              'batch OCR mapping')
          cli_path.write_text(c, encoding='utf-8', newline='\n')
          print('Instrumentation applied only to detection.rs, ocr.rs, translation.rs and batch/cli.rs')
          '@
          $patchScript = Join-Path $env:RUNNER_TEMP 'apply_koharu_diagnostic.py'
          [System.IO.File]::WriteAllText($patchScript, $patch, [System.Text.UTF8Encoding]::new($false))
