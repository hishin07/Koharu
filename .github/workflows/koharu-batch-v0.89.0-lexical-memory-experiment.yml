          memory_helper = r'''/// Read-only, opt-in chapter memory. The caller selects the same-work EN->FR file.
          /// Keep the newly learned chapter profile authoritative; never persist the merged profile.
          fn lexical_memory(
              path: &std::path::Path,
              profile: Option<TranslationProfile>,
              segments: &[String],
          ) -> Result<(Option<TranslationProfile>, serde_json::Value)> {
              use std::io::Read;
              const MAX_BYTES: u64 = 65_536;
              const MAX_TERMS: usize = 64;
              const MAX_ADDED: usize = 16;
              let file = std::fs::File::open(path)?;
              let mut bytes = Vec::new();
              file.take(MAX_BYTES + 1).read_to_end(&mut bytes)?;
              anyhow::ensure!(bytes.len() as u64 <= MAX_BYTES, "lexical memory file too large");
              // PowerShell 5.1 may write a UTF-8 BOM.
              let data: serde_json::Value = serde_json::from_slice(bytes.strip_prefix(&[0xef, 0xbb, 0xbf]).unwrap_or(&bytes))?;
              anyhow::ensure!(data["schema"].as_str() == Some("koharu-lexical-memory-v1")
                  && data["source_language"].as_str() == Some("en-US")
                  && data["target_language"].as_str() == Some("fr-FR"), "unexpected lexical memory schema or language");
              let previous: TranslationProfile = serde_json::from_value(data["profile"].clone())?;
              anyhow::ensure!(previous.characters.len() + previous.glossary.len() <= MAX_TERMS, "too many lexical memory candidates");
              let chapter: Vec<Vec<String>> = segments.iter().map(|text| lexical_tokens(text)).collect();
              let mut resolved = profile.unwrap_or_default();
              let mut occupied: std::collections::HashSet<Vec<String>> = resolved.characters.iter()
                  .chain(resolved.glossary.iter()).map(|term| lexical_tokens(&term.source)).collect();
              let mut counts = std::collections::HashMap::<Vec<String>, usize>::new();
              for term in previous.characters.iter().chain(previous.glossary.iter()) {
                  *counts.entry(lexical_tokens(&term.source)).or_default() += 1;
              }
              let mut decisions = Vec::new();
              let mut added = 0usize;
              for (kind, terms) in [("character", previous.characters), ("glossary", previous.glossary)] {
                  for term in terms {
                      let source = term.source.trim();
                      let target = term.target.trim();
                      let key = lexical_tokens(source);
                      // Deliberately narrow pilot: only single alphabetic names with unchanged
                      // letters (case may differ). No translated terms, descriptions or old dialogue.
                      let reason = if source.len() < 3 || source.len() > 40
                          || !source.bytes().all(|c| c.is_ascii_alphabetic())
                          || !source.eq_ignore_ascii_case(target) {
                          "not_identity_name"
                      } else if counts.get(&key).copied().unwrap_or(0) != 1 {
                          "ambiguous_previous_key"
                      } else if !lexical_source_present(source, &chapter) {
                          "not_in_current_chapter"
                      } else if occupied.contains(&key) {
                          "current_profile_has_key"
                      } else if added >= MAX_ADDED {
                          "budget_reached"
                      } else {
                          let candidate = ProfileTerm::new(source, target);
                          if kind == "character" { resolved.characters.push(candidate); }
                          else { resolved.glossary.push(candidate); }
                          occupied.insert(key);
                          added += 1;
                          "added"
                      };
                      decisions.push(serde_json::json!({"kind": kind, "source": source, "target": target, "decision": reason}));
                  }
              }
              let trace = serde_json::json!({"enabled": true, "policy": "identity-name-additive-v1",
                  "added_count": added, "decisions": decisions});
              Ok((Some(resolved).filter(|p| !p.is_empty()), trace))
          }

          '''
