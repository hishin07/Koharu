          +fn lab_files(root: &Path, dir: &Path, files: &mut std::collections::BTreeMap<String, PathBuf>) -> Result<()> {
          +    for entry in std::fs::read_dir(dir)? {
          +        let path = entry?.path();
          +        let metadata = lab_metadata(&path)?;
          +        if metadata.is_dir() {
