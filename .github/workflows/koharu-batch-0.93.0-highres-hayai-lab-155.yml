          +// The provisioner creates the dedicated lab layout and its complete manifest.
          +fn lab_metadata(path: &Path) -> Result<std::fs::Metadata> {
          +    let metadata = std::fs::symlink_metadata(path)?;
          +    ensure!(!metadata.file_type().is_symlink(), "LAB: symlink refused: {}", path.display());
