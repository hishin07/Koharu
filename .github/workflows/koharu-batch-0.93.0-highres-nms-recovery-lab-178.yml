          +/// Record raw and refined masks for every group, including rejected groups.
          +/// All output is below the validated local job directory. No page-name rules.
          +fn lab_recover(raw: &[Detection], page: &RgbImage, folder: &std::path::Path)
          +    -> Result<(Vec<Detection>, serde_json::Value)> {
          +    let (mut keep, groups) = suppress::lab_groups(raw);
          +    let mut records = Vec::new();
          +    for (parent, children, ambiguous) in groups {
          +        let mut evidence = Vec::new();
          +        let mut glyphs = Vec::new();
          +        for &id in std::iter::once(&parent).chain(children.iter()) {
          +            let d = &raw[id];
          +            let glyph = measure::glyph_mask(&d.mask, d.bbox, page);
          +            let mut masks = Vec::new();
          +            for (kind, mask) in [("raw", &d.mask), ("glyph", &glyph)] {
          +                let filename = format!("recovery_{parent:03}_{id:03}_{kind}.png");
          +                let file = if mask.width > 0 && mask.height > 0 {
          +                    image::GrayImage::from_raw(mask.width, mask.height, mask.pixels.clone())
          +                        .context("LAB: invalid recovery mask")?.save(folder.join(&filename))?;
          +                    Some(filename)
          +                } else { None };
          +                masks.push(serde_json::json!({"kind": kind, "file": file,
          +                    "rect_xywh": [mask.x, mask.y, mask.width, mask.height]}));
          +            }
          +            evidence.push(serde_json::json!({"index": id, "masks": masks}));
          +            glyphs.push(glyph);
          +        }
          +        let geometry = children.len() == 2 && suppress::lab_geometry(&raw[parent], &raw[children[0]], &raw[children[1]]);
          +        let (mask_pass, metrics) = if children.len() == 2 {
          +            suppress::lab_mask_metrics(&glyphs[0], &glyphs[1], &glyphs[2])
          +        } else { (false, serde_json::Value::Null) };
          +        let accepted = !ambiguous && geometry && mask_pass;
          +        if accepted {
          +            keep[parent] = false;
          +            for &child in &children { keep[child] = true; }
          +        }
          +        records.push(serde_json::json!({"parent": parent, "children": children,
          +            "ambiguous_owner_or_cross_group": ambiguous, "geometry_pass": geometry, "mask_pass": mask_pass,
          +            "metrics": metrics, "accepted": accepted, "evidence": evidence}));
          +    }
          +    let selected = raw.iter().zip(keep).filter(|(_, kept)| *kept)
          +        .map(|(d, _)| d.clone()).collect();
          +    Ok((selected, serde_json::Value::Array(records)))
          +}
          +
          +fn lab_snapshot(detections: &[Detection]) -> serde_json::Value {
          +    serde_json::Value::Array(detections.iter().enumerate().map(|(index, d)| {
          +        serde_json::json!({
          +            "index": index, "label": &d.label, "score": d.score, "bbox": d.bbox,
          +            "mask_rect_xywh": [d.mask.x, d.mask.y, d.mask.width, d.mask.height],
          +            "mask_pixels": d.mask.pixels.iter().filter(|v| **v != 0).count()
          +        })
          +    }).collect())
          +}
