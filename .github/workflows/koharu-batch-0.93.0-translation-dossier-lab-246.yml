              ('crates/koharu-batch/src/main.rs','5e8eee1887608ccb32de54108753dc1f532eecb5cfbb9e4423df69806e5b14e7','bd9c314442ab1731351597cbc2b64fbb3a6dd7163124f051c7869a188b644353','//! `koharu-batch`: one chapter, end to end, from a terminal.\n\nmod cli;\nmod preset;\nmod prune;\nmod report;\nmod run;\n\nuse anyhow::Result;\n\n\n#[tokio::main]\nasync fn main() -> Result<()> {\n    tracing_subscriber::fmt()\n        .with_env_filter(\n            tracing_subscriber::EnvFilter::try_from_default_env().unwrap_or_else(|_| {\n                tracing_subscriber::EnvFilter::new("warn,koharu_batch=info,koharu_pipeline=info")\n            }),\n        )\n        .with_writer(std::io::stderr)\n        .init();\n    let args: Vec<_> = std::env::args_os().skip(1).collect();\n    if args.len() == 1 && args[0] == std::ffi::OsStr::new("--help") {\n        println!("LAB208: lab-hybrid INPUT_MANIFEST OUTPUT_DIR; lab-lama-replay INPUT_MANIFEST OUTPUT_DIR");\n        return Ok(());\n    }\n    anyhow::ensure!(args.len() == 3 && (args[0] == std::ffi::OsStr::new("lab-lama-replay") || args[0] == std::ffi::OsStr::new("lab-hybrid")), "LAB208: usage lab-hybrid INPUT_MANIFEST OUTPUT_DIR or lab-lama-replay INPUT_MANIFEST OUTPUT_DIR");\n    if args[0] == std::ffi::OsStr::new("lab-hybrid") {\n        run::run_hybrid208(std::path::Path::new(&args[1]), std::path::Path::new(&args[2])).await\n    } else {\n        run::run_lama_replay(std::path::Path::new(&args[1]), std::path::Path::new(&args[2])).await\n    }\n}\n',False),
              ('crates/koharu-batch/src/run.rs','f85b8394b1ae0fd195fd38bd30ccc2740a2f3fc5e5b582ade55c6800c9d13399','b992786ee52995129f3e2d0d0444261e2450a103ca3a3c8d446b6ebd2a45a948','\n// LAB208: one guarded integration of an existing HighRes scene and external OCR.\n// The source project is never edited; all work is on a new diagnostic copy.\nstruct HybridBlock208 {\n    id: koharu_scene::LayerId,\n    region: image::GrayImage,\n    erase: image::GrayImage,\n    held: bool,\n    reason: String,\n}\nstruct HybridPage208 {\n    id: PageId,\n    original: image::RgbImage,\n    blocks: Vec<HybridBlock208>,\n}\nfn hybrid_union208(dst: &mut image::GrayImage, src: &image::GrayImage) {\n    for (a,b) in dst.pixels_mut().zip(src.pixels()) { a.0[0] |= b.0[0]; }\n}\nfn hybrid_conflict208(page: &mut HybridPage208) -> image::GrayImage {\n    loop {\n        let mut protect = image::GrayImage::new(page.original.width(),page.original.height());\n        for block in &page.blocks { if block.held { hybrid_union208(&mut protect,&block.region); } }\n        let mut changed = false;\n        for block in &mut page.blocks {\n            if !block.held && block.erase.as_raw().iter().zip(protect.as_raw()).any(|(&a,&b)| a != 0 && b != 0) {\n                block.held = true; block.reason = "protected_overlap".to_owned(); changed = true;\n            }\n        }\n        if !changed { return protect; }\n    }\n}\nfn hybrid_hold_ops208(page: &HybridPage208) -> Vec<Op> {\n    page.blocks.iter().map(|b| Op::UpdateLayer { layer: b.id.into(), patch: if b.held {\n        json!({"translation":null,"cleanup":{"visible":false}})\n    } else { json!({"cleanup":{"visible":false}}) } }).collect()\n}\nfn hybrid_frame208(dst: &mut image::GrayImage, rect: koharu_scene::Rect) {\n    // Rect::covering and tile coverage are page-clipped by the scene APIs.\n    for y in 0..rect.height { for x in 0..rect.width {\n        let (px,py)=(i64::from(rect.x)+i64::from(x),i64::from(rect.y)+i64::from(y));\n        if px >= 0 && py >= 0 && px < i64::from(dst.width()) && py < i64::from(dst.height()) { dst.put_pixel(px as u32,py as u32,image::Luma([255])); }\n    } }\n}\nfn hybrid_dilate208(mask: &image::GrayImage, radius: u32) -> image::GrayImage {\n    // Small separable square dilation, on the full page (not a clipped tile).\n    let (w,h)=mask.dimensions();\n    let horizontal=image::GrayImage::from_fn(w,h,|x,y| image::Luma([if (x.saturating_sub(radius)..=x.saturating_add(radius).min(w-1)).any(|xx| mask.get_pixel(xx,y).0[0]!=0) {255} else {0}]));\n    image::GrayImage::from_fn(w,h,|x,y| image::Luma([if (y.saturating_sub(radius)..=y.saturating_add(radius).min(h-1)).any(|yy| horizontal.get_pixel(x,yy).0[0]!=0) {255} else {0}]))\n}\npub async fn run_hybrid208(manifest_path: &Path, output: &Path) -> Result<()> {\n    verify_lab(output).await?;\n    let exe=std::env::current_exe()?;\n    let lab=exe.parent().and_then(Path::parent).context("LAB208: invalid executable layout")?;\n    let inputs=lab.join("inputs");\n    let folder=manifest_path.parent().context("LAB208: missing input folder")?;\n    ensure!(lab_metadata(&inputs)?.is_dir() && manifest_path.is_absolute() && folder.parent().context("LAB208: input parent")?.canonicalize()?==inputs.canonicalize()?, "LAB208: input outside dedicated inputs");\n    ensure!(lab_metadata(folder)?.is_dir() && lab_metadata(manifest_path)?.is_file() && manifest_path.file_name().and_then(|s|s.to_str())==Some("hybrid-manifest.json"),"LAB208: bad manifest path");\n    let bytes=fs_err::read(manifest_path)?;\n    ensure!(bytes.len()<=2_000_000,"LAB208: manifest too large");\n    let manifest:serde_json::Value=serde_json::from_slice(&bytes)?;\n    ensure!(manifest["schema"]=="koharu-hybrid-native-v1","LAB208: wrong schema");\n    let source=folder.join("project.khr");\n    let size=manifest["project"]["size_bytes"].as_u64().context("LAB208: missing project size")?;\n    let sha=manifest["project"]["sha256"].as_str().context("LAB208: missing project hash")?;\n    ensure!(size>0 && size<=150_000_000 && sha.len()==64 && sha.bytes().all(|c|c.is_ascii_hexdigit()) && lab_metadata(&source)?.is_file(),"LAB208: invalid project identity");\n    koharu_runtime::lab_verify_file(&source,size,sha).await?;\n    // Do not open the original: SQLite may create sidecars or update metadata.\n    fs_err::create_dir(output)?;\n    let dest=output.join("project.khr");\n    fs_err::copy(&source,&dest)?;\n    koharu_runtime::lab_verify_file(&dest,size,sha).await?;\n    let mut session=Session::open(&dest)?;\n    let project=session.project();\n    let rows=manifest["pages"].as_array().context("LAB208: pages missing")?;\n    ensure!(!rows.is_empty() && rows.len()<=24 && rows.len()==project.pages().count(),"LAB208: page count mismatch");\n    let mut work=Vec::new(); let mut ops=Vec::new(); let mut total=0usize;\n    for (page,row) in project.pages().zip(rows) {\n        ensure!(row["id"]==json!(page.id),"LAB208: page id/order mismatch");\n        let background=page.background.context("LAB208: missing background")?;\n        ensure!(background.visible,"LAB208: hidden background");\n        let original=image::load_from_memory(&session.file(&background.file)?)?.into_rgb8();\n        let (w,h)=original.dimensions();\n        ensure!(w>0 && h>0 && w<=4096 && h<=4096 && u64::from(w)*u64::from(h)<=4_000_000 && w==page.size.width && h==page.size.height,"LAB208: invalid page dimensions");\n        let blocks=project.blocks(page.id)?;\n        let listed=row["blocks"].as_array().context("LAB208: blocks missing")?;\n        ensure!(blocks.len()==listed.len(),"LAB208: block count mismatch");\n        let mut seen=BTreeSet::new();\n        let mut pagework=HybridPage208 {id:page.id,original,blocks:Vec::new()};\n        for item in listed {\n            let id:koharu_scene::LayerId=serde_json::from_value(item["id"].clone())?;\n            ensure!(seen.insert(id),"LAB208: duplicated block");\n            let (_,block)=blocks.iter().find(|(actual,_)| *actual==id).context("LAB208: unknown block")?;\n            ensure!(json!(block.role)==item["role"] && block.source.content.text()==item["hayai"].as_str().context("LAB208: original text missing")? && block.translation.is_none(),"LAB208: original block mismatch or already translated");\n            let text=item["paddle"].as_str().context("LAB208: missing Paddle text")?;\n            ensure!(text.len()<=16_384,"LAB208: OCR too long");\n            let decision=item["decision"].as_str().context("LAB208: missing decision")?;\n            ensure!(matches!(decision,"paddle"|"preserve_sfx"|"preserve_symbols"|"review_secondary"),"LAB208: unknown decision");\n            let held=decision!="paddle";\n            ensure!(held || (item["role"]=="text" && !text.trim().is_empty()),"LAB208: invalid allowed source");\n            let (rect,mask)=session.tiles(block.mask.id,None)?.coverage(w,h).context("LAB208: missing mask")?;\n            let mut glyph=image::GrayImage::new(w,h);\n            for (x,y,pixel) in mask.enumerate_pixels() { if pixel.0[0]!=0 {\n                let px=i64::from(rect.x)+i64::from(x); let py=i64::from(rect.y)+i64::from(y);\n                ensure!(px>=0 && py>=0 && px<i64::from(w) && py<i64::from(h),"LAB208: mask outside page");\n                glyph.put_pixel(px as u32,py as u32,image::Luma([255]));\n            } }\n            ensure!(glyph.as_raw().iter().any(|&v|v!=0),"LAB208: empty mask");\n            let mut region=glyph.clone();\n            let frame=koharu_scene::Rect::covering(block.source.bounds().context("LAB208: missing frame")?,w,h).context("LAB208: frame outside page")?;\n            hybrid_frame208(&mut region,frame);\n            let (_,parent)=project.parent(id)?;\n            let balloon=parent.is_some_and(|p| matches!(&p.content,koharu_scene::Content::Balloon(_)));\n            // +3 experimentally for text attached to a balloon, +0 for free text.\n            let erase=if balloon && !held {hybrid_dilate208(&glyph,3)} else {glyph};\n            pagework.blocks.push(HybridBlock208{id,region,erase,held,reason:decision.to_owned()});\n            ops.push(Op::UpdateLayer{layer:id.into(),patch:json!({"source":{"content":text,"language":"en"},"cleanup":{"visible":false}})});\n            ops.push(Op::SetAttribute{layer:id.into(),namespace:"hybrid_lab".to_owned(),key:"ocr".to_owned(),value:Some(json!({"hayai":item["hayai"],"paddle":text,"decision":decision}))});\n            total+=1; ensure!(total<=300,"LAB208: too many blocks");\n        }\n        hybrid_conflict208(&mut pagework);\n        // Exclude held content from the chapter dossier as well as page translation.\n        for b in &pagework.blocks { if b.held { ops.push(Op::UpdateLayer{layer:b.id.into(),patch:json!({"source":{"content":""}})}); } }\n        work.push(pagework);\n    }\n    session.apply(Edit{label:"Hybrid OCR import (diagnostic)".to_owned(),ops})?;\n    let session=Arc::new(Mutex::new(session));\n    let device=koharu_runtime::device().await?;\n    ensure!(matches!(device.backend,koharu_runtime::Backend::Cuda{..}),"LAB208: CUDA required");\n    let targets:Vec<_>=work.iter().flat_map(|p|p.blocks.iter()).filter(|b|!b.held).map(|b|b.id).collect();\n    if !targets.is_empty() {\n        let config:PipelineConfig=serde_json::from_value(json!({"translator":{"model":"koharu/hy-mt2-7b:Q4_K_M","target":"fr","vision":false,"temperature":0.0,"instructions":"Translate English manga dialogue into natural French. Keep meaning, names and tone. Do not invent text."}}))?;\n        let pipeline=Pipeline::new(config);\n        let run=pipeline.run(Arc::clone(&session),Request{target:Target::Blocks(targets),stages:BTreeSet::from([Stage::Translate]),config:None})?;\n        let history=pipeline.history(run,Duration::from_secs(1800)).await?;\n        fs_err::write(output.join("translate-events.json"),serde_json::to_vec_pretty(&history)?)?;\n        if !matches!(history.last(),Some(Event::Ended{outcome:Outcome::Done,..})) {pipeline.stop(); bail!("LAB208: translation failed or timed out; no diagnostic pages published");}\n        pipeline.unload(); drop(pipeline);\n    }\n    // A failed/unchanged translation must never erase the original. Recompute\n    // protection after translation; a new hold can propagate to neighbours.\n    {\n        let mut lock=session.lock(); let project=lock.project(); let mut ops=Vec::new();\n        for page in &mut work {\n            for b in &mut page.blocks { if !b.held {\n                let koharu_scene::Content::Block(block)=&project.layer(b.id)?.content else {bail!("LAB208: block changed")};\n                if block.translation.as_ref().is_none_or(|t|t.content.text().trim().is_empty()) { b.held=true; b.reason="missing_or_unchanged_translation".to_owned(); }\n            } }\n            hybrid_conflict208(page); ops.extend(hybrid_hold_ops208(page));\n        }\n        lock.apply(Edit{label:"Hybrid protect before cleaning".to_owned(),ops})?;\n    }\n    let lama=koharu_ml::lama::Lama::load(device).await?;\n    let mut reports=Vec::new();\n    for (i,page) in work.iter_mut().enumerate() {\n        let protect=hybrid_conflict208(page);\n        let mut request=image::GrayImage::new(page.original.width(),page.original.height());\n        for b in &page.blocks {if !b.held {hybrid_union208(&mut request,&b.erase);}}\n        let effective=lab202_effective(&request,&protect)?;\n        ensure!(effective==request,"LAB208: unhandled protection overlap");\n        let raw=if request.as_raw().iter().any(|&v|v!=0) {lama.inference(&image::DynamicImage::ImageRgb8(page.original.clone()),&effective)?} else {page.original.clone()};\n        let clean=lab202_compose(&page.original,&raw,&effective)?;\n        let prefix=format!("page-{:02}",i+1);\n        let mut encoded=std::io::Cursor::new(Vec::new());\n        image::DynamicImage::ImageRgb8(clean.clone()).write_to(&mut encoded,image::ImageFormat::Png)?;\n        let bytes=encoded.into_inner(); let hash=Hash::of(&bytes);\n        let mut lock=session.lock();\n        lock.apply(Edit{label:"Hybrid guarded background".to_owned(),ops:vec![Op::AddFile{bytes},Op::SetBackground{page:page.id.into(),background:Some(koharu_scene::Background{file:hash,visible:true})}]})?;\n        let rendered=Renderer::get().render(&lock,page.id)?.rasterize()?.image;\n        ensure!(rendered.dimensions()==page.original.dimensions(),"LAB208: renderer size mismatch");\n        let opaque=rendered.pixels().all(|p|p.0[3]==255);\n        let rendered=image::DynamicImage::ImageRgba8(rendered).into_rgb8();\n        let changed=page.original.enumerate_pixels().filter(|(x,y,p)|protect.get_pixel(*x,*y).0[0]!=0 && rendered.get_pixel(*x,*y)!=*p).count();\n        let mut text_zone=image::GrayImage::new(page.original.width(),page.original.height());\n        let placed=lock.project();\n        for b in &page.blocks { if !b.held {\n            let koharu_scene::Content::Block(block)=&placed.layer(b.id)?.content else {bail!("LAB208: missing placed block")};\n            let bounds=block.translation.as_ref().and_then(|t|t.bounds()).context("LAB208: missing translation bounds")?;\n            let rect=koharu_scene::Rect::covering(bounds,rendered.width(),rendered.height()).context("LAB208: translation outside page")?;\n            hybrid_frame208(&mut text_zone,rect);\n        } }\n        // A two-pixel allowance for antialiasing/outline; protection remains exact.\n        let text_zone=hybrid_dilate208(&text_zone,2);\n        let outside=clean.enumerate_pixels().filter(|(x,y,p)|text_zone.get_pixel(*x,*y).0[0]==0 && rendered.get_pixel(*x,*y)!=*p).count();\n        let accepted=opaque && changed==0 && outside==0;\n        let final_image=if accepted {&rendered} else {&page.original};\n        protect.save(output.join(format!("{prefix}-protect.png")))?;\n        effective.save(output.join(format!("{prefix}-effective.png")))?;\n        page.original.save(output.join(format!("{prefix}-original.png")))?;\n        clean.save(output.join(format!("{prefix}-clean.png")))?;\n        final_image.save(output.join(format!("{prefix}-diagnostic.png")))?;\n        ensure!(image::open(output.join(format!("{prefix}-diagnostic.png")))?.into_rgb8()==*final_image,"LAB208: PNG mismatch");\n        let current=lock.project();\n        let block_reports:Vec<_>=page.blocks.iter().map(|b| {\n            let translated=current.layer(b.id).ok().and_then(|l|match &l.content {koharu_scene::Content::Block(v)=>v.translation.as_ref().map(|t|t.content.text()),_=>None});\n            json!({"id":b.id,"held":b.held,"reason":b.reason,"translation":translated})\n        }).collect();\n        reports.push(json!({"page":prefix,"id":page.id,"protected_changed_candidate":changed,"outside_translation_zone_candidate":outside,"opaque":opaque,"status":if accepted {"diagnostic_render"} else {"original_fallback"},"blocks":block_reports}));\n    }\n    fs_err::write(output.join("hybrid-report.json"),serde_json::to_vec_pretty(&json!({"schema":"koharu-hybrid-native-result-v1","status":"diagnostic_only_not_for_publication","pages":reports}))?)?;\n    koharu_runtime::lab_verify_file(&source,size,sha).await?;\n    Ok(())\n}\n\n#[cfg(test)]\nmod hybrid208_tests {\n    use super::*;\n    #[test]\n    fn lab208_dilation() {\n        let mask=image::GrayImage::from_raw(5,1,vec![0,0,255,0,0]).unwrap();\n        assert_eq!(hybrid_dilate208(&mask,1).as_raw(),&[0,255,255,255,0]);\n        assert_eq!(hybrid_dilate208(&mask,3).as_raw(),&[255;5]);\n    }\n    #[test]\n    fn lab208_conflict_is_atomic() {\n        let make=|region,erase,held|HybridBlock208{id:koharu_scene::LayerId(koharu_scene::Uuid::now_v7()),region:image::GrayImage::from_raw(3,1,region).unwrap(),erase:image::GrayImage::from_raw(3,1,erase).unwrap(),held,reason:String::new()};\n        let mut p=HybridPage208{id:PageId(koharu_scene::Uuid::now_v7()),original:image::RgbImage::new(3,1),blocks:vec![make(vec![255,0,0],vec![0,0,0],true),make(vec![255,255,0],vec![255,255,0],false),make(vec![0,255,255],vec![0,255,255],false)]};\n        assert_eq!(hybrid_conflict208(&mut p).as_raw(),&[255;3]);\n        assert!(p.blocks.iter().all(|b|b.held));\n    }\n}\n',True),
