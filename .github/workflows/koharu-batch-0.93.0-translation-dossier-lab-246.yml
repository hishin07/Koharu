          new_main='//! `koharu-batch`: one chapter, end to end, from a terminal.\n\nmod cli;\nmod preset;\nmod prune;\nmod report;\nmod run;\n\nuse anyhow::Result;\n\n\n#[tokio::main]\nasync fn main() -> Result<()> {\n    tracing_subscriber::fmt()\n        .with_env_filter(\n            tracing_subscriber::EnvFilter::try_from_default_env().unwrap_or_else(|_| {\n                tracing_subscriber::EnvFilter::new("warn,koharu_batch=info,koharu_pipeline=info")\n            }),\n        )\n        .with_writer(std::io::stderr)\n        .init();\n    let args: Vec<_> = std::env::args_os().skip(1).collect();\n    if args.len() == 1 && args[0] == std::ffi::OsStr::new("--help") {\n        println!("LAB219: lab-typography INPUT_MANIFEST OUTPUT_DIR");\n        return Ok(());\n    }\n    anyhow::ensure!(args.len() == 3 && args[0] == std::ffi::OsStr::new("lab-typography"), "LAB219: usage lab-typography INPUT_MANIFEST OUTPUT_DIR");\n    run::run_typography219(std::path::Path::new(&args[1]), std::path::Path::new(&args[2])).await\n}\n'
          extra='\n// LAB219: replay the frozen translations and guarded backgrounds of LAB208.\n// No detection, OCR, translation, LaMa, or publication in this entry point.\nasync fn typography_file219(folder: &Path, name: &str, info: &serde_json::Value) -> Result<PathBuf> {\n    let path=folder.join(name);\n    let size=info["size_bytes"].as_u64().context("LAB219: missing file size")?;\n    let sha=info["sha256"].as_str().context("LAB219: missing hash")?;\n    ensure!(size>0 && size<=150_000_000 && sha.len()==64 && sha.bytes().all(|c|c.is_ascii_hexdigit()) && lab_metadata(&path)?.is_file(),"LAB219: invalid file identity");\n    koharu_runtime::lab_verify_file(&path,size,sha).await?;\n    Ok(path)\n}\nfn typography_size219(nominal: f64, local: f64) -> f64 {\n    // Experimental bound relative to the previously placed nominal size.\n    local.clamp(nominal*0.8,nominal*1.5)\n}\npub async fn run_typography219(manifest_path: &Path, output: &Path) -> Result<()> {\n    verify_lab(output).await?;\n    let exe=std::env::current_exe()?;\n    let lab=exe.parent().and_then(Path::parent).context("LAB219: invalid executable layout")?;\n    let inputs=lab.join("inputs");\n    let folder=manifest_path.parent().context("LAB219: missing input folder")?;\n    ensure!(lab_metadata(&inputs)?.is_dir() && manifest_path.is_absolute() && folder.parent().context("LAB219: missing input parent")?.canonicalize()?==inputs.canonicalize()?,"LAB219: input outside dedicated inputs");\n    ensure!(lab_metadata(folder)?.is_dir() && lab_metadata(manifest_path)?.is_file() && manifest_path.file_name().and_then(|s|s.to_str())==Some("typography-manifest.json"),"LAB219: bad manifest path");\n    ensure!(lab_metadata(manifest_path)?.len()<=2_000_000,"LAB219: oversized manifest");\n    let manifest:serde_json::Value=serde_json::from_slice(&fs_err::read(manifest_path)?)?;\n    ensure!(manifest["schema"]=="koharu-typography-replay-v1","LAB219: wrong schema");\n    let source=typography_file219(folder,"project.khr",&manifest["project"]).await?;\n    let rows=manifest["pages"].as_array().context("LAB219: missing pages")?;\n    ensure!(rows.len()==19,"LAB219: expected chapter of 19 pages");\n    let mut inputs219=Vec::new();\n    for (i,row) in rows.iter().enumerate() {\n        let prefix=format!("page-{:02}",i+1);\n        let mut files=Vec::new();\n        for kind in ["original","clean","protect","effective","diagnostic"] {\n            files.push(typography_file219(folder,&format!("{prefix}-{kind}.png"),&row["files"][kind]).await?);\n        }\n        inputs219.push(files);\n    }\n    fs_err::create_dir(output)?;\n    let mut reports=Vec::new();\n    for variant in ["A-baseline","B-local-size","C-inset-065"] {\n        let dir=output.join(variant);\n        fs_err::create_dir(&dir)?;\n        let dest=dir.join("project.khr");\n        fs_err::copy(&source,&dest)?;\n        koharu_runtime::lab_verify_file(&dest,manifest["project"]["size_bytes"].as_u64().context("LAB219: project size")?,manifest["project"]["sha256"].as_str().context("LAB219: project hash")?).await?;\n        let mut session=Session::open(&dest)?;\n        let page_ids:Vec<_>=session.project().pages().map(|p|p.id).collect();\n        ensure!(page_ids.len()==rows.len(),"LAB219: page count mismatch");\n        for (i,id) in page_ids.into_iter().enumerate() {\n            let row=&rows[i]; let prefix=format!("page-{:02}",i+1);\n            ensure!(json!(id)==row["id"],"LAB219: page order mismatch");\n            let paths=&inputs219[i];\n            let original=image::open(&paths[0])?.into_rgb8();\n            let clean=image::open(&paths[1])?.into_rgb8();\n            let protect=image::open(&paths[2])?.into_luma8();\n            let effective=image::open(&paths[3])?.into_luma8();\n            let old=image::open(&paths[4])?.into_rgb8();\n            ensure!(original.dimensions()==(784,1145) && [clean.dimensions(),protect.dimensions(),effective.dimensions(),old.dimensions()].iter().all(|&d|d==original.dimensions()),"LAB219: dimensions mismatch");\n            ensure!(protect.as_raw().iter().chain(effective.as_raw()).all(|&p|p==0 || p==255),"LAB219: nonbinary mask");\n            ensure!(protect.as_raw().iter().zip(effective.as_raw()).all(|(&a,&b)|a==0 || b==0),"LAB219: conflicting masks");\n            ensure!(original.enumerate_pixels().all(|(x,y,p)|effective.get_pixel(x,y).0[0]!=0 || clean.get_pixel(x,y)==p),"LAB219: altered frozen background outside mask");\n            ensure!(original.enumerate_pixels().all(|(x,y,p)|protect.get_pixel(x,y).0[0]==0 || old.get_pixel(x,y)==p),"LAB219: prior output changed protected pixels");\n            let (ops,translations)={\n                let project=session.project(); let page=project.page(id)?;\n                let background=page.background.context("LAB219: missing background")?;\n                ensure!(background.visible && image::load_from_memory(&session.file(&background.file)?)?.into_rgb8()==clean,"LAB219: frozen project background mismatch");\n                let mut ops=Vec::new(); let mut translations=Vec::new();\n                for (block_id,block) in project.blocks(id)? {\n                    if let Some(t)=&block.translation {\n                        ensure!(!t.content.text().trim().is_empty(),"LAB219: empty translation");\n                        translations.push((block_id,t.content.text().to_owned()));\n                        let (_,parent)=project.parent(block_id)?;\n                        let balloon=parent.is_some_and(|p|matches!(&p.content,koharu_scene::Content::Balloon(_)));\n                        if balloon && block.role==koharu_scene::Role::Text && matches!(&t.frame,koharu_scene::Frame::Path{..}) {\n                            let patch=match variant {\n                                "B-local-size" => match (t.style.chars.size,block.source.style.chars.size) {\n                                    (Some(n),Some(s)) if n.is_finite() && s.is_finite() && n>0.0 && s>0.0 => Some(json!({"translation":{"style":{"chars":{"size":typography_size219(n,s)}}}})),\n                                    _=>None,\n                                },\n                                "C-inset-065"=>Some(json!({"translation":{"frame":{"path":{"inset":0.65}}}})),\n                                _=>None,\n                            };\n                            if let Some(patch)=patch {ops.push(Op::UpdateLayer{layer:block_id.into(),patch});}\n                        }\n                    }\n                }\n                ensure!(translations.len()==row["active_count"].as_u64().context("LAB219: missing count")? as usize,"LAB219: active count mismatch");\n                (ops,translations)\n            };\n            if !ops.is_empty() {session.apply(Edit{label:format!("Typography diagnostic {variant}"),ops})?;}\n            let project=session.project();\n            let mut text_zone=image::GrayImage::new(original.width(),original.height());\n            let mut block_reports=Vec::new();\n            for (block_id,expected) in &translations {\n                let koharu_scene::Content::Block(block)=&project.layer(*block_id)?.content else {bail!("LAB219: block changed")};\n                let t=block.translation.as_ref().context("LAB219: translation missing")?;\n                ensure!(t.content.text()==*expected,"LAB219: translation changed");\n                let bounds=t.bounds().context("LAB219: missing translation bounds")?;\n                let rect=koharu_scene::Rect::covering(bounds,original.width(),original.height()).context("LAB219: bounds outside page")?;\n                hybrid_frame208(&mut text_zone,rect);\n                let layout=Renderer::get().layout(*block_id,t)?.context("LAB219: empty layout")?;\n                block_reports.push(json!({"id":block_id,"nominal":t.style.chars.size,"actual_run_sizes":layout.runs.iter().map(|r|r.size).collect::<Vec<_>>(),"scale":layout.scale,"overflowed":layout.overflowed,"uncovered":layout.uncovered,"hyphens":layout.hyphens}));\n            }\n            let text_zone=hybrid_dilate208(&text_zone,2);\n            let rendered=Renderer::get().render(&session,id)?.rasterize()?.image;\n            ensure!(rendered.dimensions()==original.dimensions(),"LAB219: renderer size mismatch");\n            let opaque=rendered.pixels().all(|p|p.0[3]==255);\n            let candidate=image::DynamicImage::ImageRgba8(rendered).into_rgb8();\n            let changed=original.enumerate_pixels().filter(|(x,y,p)|protect.get_pixel(*x,*y).0[0]!=0 && candidate.get_pixel(*x,*y)!=*p).count();\n            let outside_map=image::GrayImage::from_fn(original.width(),original.height(),|x,y|image::Luma([if text_zone.get_pixel(x,y).0[0]==0 && candidate.get_pixel(x,y)!=clean.get_pixel(x,y) {255} else {0}]));\n            let outside=outside_map.as_raw().iter().filter(|&&v|v!=0).count();\n            let accepted=opaque && changed==0 && outside==0;\n            let final_image=if accepted {&candidate} else {&original};\n            let previous_diff=final_image.pixels().zip(old.pixels()).filter(|(a,b)|a!=b).count();\n            final_image.save(dir.join(format!("{prefix}-diagnostic.png")))?;\n            if !accepted {\n                candidate.save(dir.join(format!("{prefix}-REJECTED-candidate.png")))?;\n                outside_map.save(dir.join(format!("{prefix}-outside.png")))?;\n            }\n            reports.push(json!({"variant":variant,"page":prefix,"id":id,"status":if accepted {"diagnostic_render"} else {"original_fallback"},"opaque":opaque,"protected_changed_candidate":changed,"outside_translation_zone_candidate":outside,"different_pixels_vs_216":previous_diff,"blocks":block_reports}));\n        }\n    }\n    fs_err::write(output.join("typography-report.json"),serde_json::to_vec_pretty(&json!({"schema":"koharu-typography-replay-result-v1","status":"diagnostic_only_not_for_publication","pages":reports}))?)?;\n    typography_file219(folder,"project.khr",&manifest["project"]).await?;\n    Ok(())\n}\n#[cfg(test)]\nmod typography219_tests {\n    use super::*;\n    #[test]\n    fn lab219_local_size_is_bounded() {\n        assert_eq!(typography_size219(10.0,2.0),8.0);\n        assert_eq!(typography_size219(10.0,12.0),12.0);\n        assert_eq!(typography_size219(10.0,30.0),15.0);\n    }\n}\n'
          main.write_bytes(new_main.encode('utf-8'))
          run.write_bytes(run.read_bytes()+extra.encode('utf-8'))
          assert digest(main.read_bytes()) == 'f3d330faaa2e931edb3c6fb9e133b12390782421903370500265eadd435f0791'
          '@
          $patchPath = Join-Path $env:RUNNER_TEMP 'lab219.py'
