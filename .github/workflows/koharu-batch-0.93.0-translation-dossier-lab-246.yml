          cargo test --release --locked -p koharu-llm --lib lab246_
          if ($LASTEXITCODE -ne 0) { throw 'Conservative dossier prompt test failed' }
      - name: Compile headless diagnostic binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p koharu-batch --bin koharu-batch
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Verify CLI guard and record artifact identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/release/koharu-batch.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing EXE' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed' }
          # No input data and no GPU use: this invocation must refuse before store initialization.
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($command in @('run','lab-hybrid','lab-typography','lab-translate-mt2','lab-translate-mt3')) {
            $guard = & $exe $command 2>&1
            if ($LASTEXITCODE -eq 0 -or ($guard -join ' ') -notmatch 'LAB238: usage lab-translate-mt2') { throw "Argument guard failed: $command" }
          }
          $guard = & $exe lab-hybrid 'unused-input' 'unused-output' 2>&1
          if ($LASTEXITCODE -eq 0 -or ($guard -join ' ') -notmatch 'LAB238: usage lab-translate-mt2') { throw 'Graphics command guard failed' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "KOHARU_LAB_246_SHA256=$hash"
          "$hash  koharu-batch.exe" | Set-Content 'target/release/koharu-lab-246-sha256.txt' -Encoding ascii
          @("source=35505f9969f6703b0d90db36a384ed062fc3bdcb", "workflow_run=$env:GITHUB_RUN_ID", "dossier=conservative-246", (rustc --version), (cargo --version)) | Set-Content 'target/release/koharu-lab-246-build.txt' -Encoding utf8
      - name: Upload diagnostic executable and provenance only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koharu-batch-0.93.0-translation-dossier-lab-246
          path: |
            target/release/koharu-batch.exe
            target/release/koharu-lab-246-sha256.txt
            target/release/koharu-lab-246-build.txt
          if-no-files-found: error
          retention-days: 7
